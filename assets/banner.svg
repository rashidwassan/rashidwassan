<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Rashid Wassan — DevSecOps Engineer</title>
  <desc id="desc">Animated banner: a CI/CD pipeline ships a build from commit to observe while a security scanner sweeps for vulnerabilities and patches them.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#141a2e"/>
      <stop offset="1" stop-color="#1a1b27"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.15" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.84" cy="0.46" r="0.38">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dcfff"/>
      <stop offset="0.5" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <linearGradient id="sweepFill" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#9ece6a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9ece6a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#c0caf5" stroke-opacity="0.045"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="360" rx="20"/></clipPath>
    <clipPath id="radarClip"><circle cx="1010" cy="170" r="110"/></clipPath>
  </defs>

  <style>
    .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; }

    .rise   { animation: rise 1.1s cubic-bezier(.2,.8,.2,1) both; }
    .rise-2 { animation: rise 1.1s cubic-bezier(.2,.8,.2,1) .25s both; }
    .grow   { transform-box: fill-box; transform-origin: left center; animation: grow 1.2s cubic-bezier(.2,.8,.2,1) .4s both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    /* whoami output: four lines, 4s each */
    .line { opacity: 0; animation: cycle 16s linear infinite; }
    .l1 { animation-delay: 0s; } .l2 { animation-delay: 4s; } .l3 { animation-delay: 8s; } .l4 { animation-delay: 12s; }
    @keyframes cycle { 0% { opacity: 0; } 2% { opacity: 1; } 23% { opacity: 1; } 25% { opacity: 0; } 100% { opacity: 0; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* pipeline: packet travels commit -> observe in ~6s, 7s loop */
    .packet { animation: travel 7s linear infinite; }
    @keyframes travel {
      0%   { transform: translateX(0);     opacity: 0; }
      4%   { opacity: 1; }
      85%  { transform: translateX(575px); opacity: 1; }
      92%, 100% { transform: translateX(575px); opacity: 0; }
    }
    .lit { opacity: 0; animation: lit 7s ease-out infinite; }
    .n0 { animation-delay: 0s; }    .n1 { animation-delay: 1.19s; } .n2 { animation-delay: 2.38s; }
    .n3 { animation-delay: 3.57s; } .n4 { animation-delay: 4.76s; } .n5 { animation-delay: 5.95s; }
    @keyframes lit { 0% { opacity: 1; } 22% { opacity: .15; } 100% { opacity: 0; } }
    .shipped { opacity: 0; animation: shipped 7s ease-out 5.95s infinite; }
    @keyframes shipped { 0%, 12% { opacity: 1; } 16%, 100% { opacity: 0; } }

    /* scanner blips: found (red) then patched (green) */
    .vuln, .fixed { opacity: 0; animation-duration: 8s; animation-iteration-count: infinite; }
    .vuln  { animation-name: vuln; }
    .fixed { animation-name: fixed; }
    .b1 { animation-delay: .6s; } .b2 { animation-delay: 3.2s; } .b3 { animation-delay: 5.4s; }
    @keyframes vuln  { 0% { opacity: 0; } 4% { opacity: 1; } 30% { opacity: 1; } 34%, 100% { opacity: 0; } }
    @keyframes fixed { 0%, 30% { opacity: 0; } 34% { opacity: 1; } 70% { opacity: 1; } 80%, 100% { opacity: 0; } }

    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .25; } }
    .hex { animation: drift 9s ease-in-out infinite; }
    .hex-2 { animation-delay: -3s; } .hex-3 { animation-delay: -6s; }
    @keyframes drift { 50% { transform: translateY(-6px); opacity: .55; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .l1 { opacity: 1; }
    }
  </style>

  <g clip-path="url(#frame)">
    <!-- backdrop -->
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect width="1200" height="360" fill="url(#glowBlue)"/>
    <rect width="1200" height="360" fill="url(#glowPurple)"/>

    <!-- faint hexagons, a nod to cluster nodes -->
    <g fill="none" stroke="#7aa2f7" stroke-opacity="0.22" stroke-width="1.5">
      <path class="hex"       d="M760 52 l26 15 v30 l-26 15 l-26 -15 v-30 z"/>
      <path class="hex hex-2" d="M812 82 l26 15 v30 l-26 15 l-26 -15 v-30 z"/>
      <path class="hex hex-3" d="M760 112 l26 15 v30 l-26 15 l-26 -15 v-30 z"/>
    </g>

    <!-- window chrome -->
    <circle cx="40" cy="36" r="6" fill="#f7768e"/>
    <circle cx="60" cy="36" r="6" fill="#e0af68"/>
    <circle cx="80" cy="36" r="6" fill="#9ece6a"/>
    <text x="100" y="41" class="mono" font-size="14" fill="#565f89">rashid@cluster:~/profile</text>

    <text x="1138" y="41" text-anchor="end" class="mono" font-size="14" fill="#565f89">status: <tspan fill="#9ece6a">Running</tspan></text>
    <circle class="pulse" cx="1152" cy="36" r="5" fill="#9ece6a"/>

    <!-- name -->
    <text x="58" y="140" class="sans rise" font-size="76" font-weight="800" letter-spacing="-1" fill="url(#nameFill)">Rashid Wassan</text>
    <rect x="62" y="158" width="150" height="4" rx="2" fill="#bb9af7" class="grow"/>

    <!-- whoami -->
    <g class="mono rise-2">
      <text x="60" y="202" font-size="19" fill="#565f89"><tspan fill="#9ece6a">$</tspan> whoami</text>
      <g font-size="25" fill="#c0caf5">
        <text x="60" y="238" class="line l1"><tspan fill="#7aa2f7">&gt;</tspan> DevSecOps engineer<tspan class="cursor" fill="#bb9af7"> ▌</tspan></text>
        <text x="60" y="238" class="line l2"><tspan fill="#7aa2f7">&gt;</tspan> securing fintech &amp; e-governance<tspan class="cursor" fill="#bb9af7"> ▌</tspan></text>
        <text x="60" y="238" class="line l3"><tspan fill="#7aa2f7">&gt;</tspan> diving deep into Kubernetes<tspan class="cursor" fill="#bb9af7"> ▌</tspan></text>
        <text x="60" y="238" class="line l4"><tspan fill="#7aa2f7">&gt;</tspan> let's build open-source DevOps tooling<tspan class="cursor" fill="#bb9af7"> ▌</tspan></text>
      </g>
    </g>

    <!-- pipeline -->
    <g>
      <line x1="60" y1="292" x2="635" y2="292" stroke="#2a2f4a" stroke-width="2"/>
      <g fill="#141a2e" stroke="#414868" stroke-width="2">
        <circle cx="60"  cy="292" r="7"/>
        <circle cx="175" cy="292" r="7"/>
        <circle cx="290" cy="292" r="7"/>
        <circle cx="405" cy="292" r="7"/>
        <circle cx="520" cy="292" r="7"/>
        <circle cx="635" cy="292" r="7"/>
      </g>
      <g filter="url(#soft)">
        <circle class="lit n0" cx="60"  cy="292" r="7" fill="#7aa2f7"/>
        <circle class="lit n1" cx="175" cy="292" r="7" fill="#7aa2f7"/>
        <circle class="lit n2" cx="290" cy="292" r="7" fill="#bb9af7"/>
        <circle class="lit n3" cx="405" cy="292" r="7" fill="#bb9af7"/>
        <circle class="lit n4" cx="520" cy="292" r="7" fill="#7dcfff"/>
        <circle class="lit n5" cx="635" cy="292" r="7" fill="#9ece6a"/>
        <circle class="packet" cx="60" cy="292" r="5" fill="#7dcfff"/>
      </g>
      <g class="mono" font-size="12" fill="#565f89" text-anchor="middle">
        <text x="60"  y="320">commit</text>
        <text x="175" y="320">scan</text>
        <text x="290" y="320">build</text>
        <text x="405" y="320">sign</text>
        <text x="520" y="320">deploy</text>
        <text x="635" y="320">observe</text>
      </g>
      <text x="656" y="297" class="mono shipped" font-size="14" fill="#9ece6a">✓ shipped</text>
    </g>

    <!-- security scanner -->
    <g>
      <g fill="none" stroke="#7aa2f7" stroke-opacity="0.28">
        <circle cx="1010" cy="170" r="110"/>
        <circle cx="1010" cy="170" r="75"/>
        <circle cx="1010" cy="170" r="40"/>
        <path d="M900 170H1120M1010 60V280" stroke-opacity="0.16"/>
      </g>
      <g clip-path="url(#radarClip)">
        <g>
          <path d="M1010 170 L1120 170 A110 110 0 0 0 1094.3 99.3 Z" fill="url(#sweepFill)"/>
          <line x1="1010" y1="170" x2="1120" y2="170" stroke="#9ece6a" stroke-width="2" stroke-opacity="0.8"/>
          <animateTransform attributeName="transform" type="rotate" from="0 1010 170" to="360 1010 170" dur="4s" repeatCount="indefinite"/>
        </g>
      </g>
      <g filter="url(#soft)">
        <circle class="vuln b1"  cx="1056" cy="128" r="5" fill="#f7768e"/>
        <circle class="fixed b1" cx="1056" cy="128" r="5" fill="#9ece6a"/>
        <circle class="vuln b2"  cx="968"  cy="214" r="5" fill="#f7768e"/>
        <circle class="fixed b2" cx="968"  cy="214" r="5" fill="#9ece6a"/>
        <circle class="vuln b3"  cx="1072" cy="214" r="5" fill="#f7768e"/>
        <circle class="fixed b3" cx="1072" cy="214" r="5" fill="#9ece6a"/>
      </g>
      <circle cx="1010" cy="170" r="4" fill="#9ece6a"/>
      <text x="1010" y="306" text-anchor="middle" class="mono" font-size="11" letter-spacing="3" fill="#565f89">SECURITY SCANNER</text>
      <text x="1010" y="327" text-anchor="middle" class="mono" font-size="14" fill="#9ece6a">0 critical · 0 high · all patched</text>
    </g>

    <!-- frame edge -->
    <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="19.5" fill="none" stroke="#7aa2f7" stroke-opacity="0.18" stroke-width="1.5"/>
  </g>
</svg>
